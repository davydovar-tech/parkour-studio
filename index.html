<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parkour Studio Launcher</title>
    
    <!-- Подключаем библиотеки Firebase Compat -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    
    <style>
        /* Дизайн лаунчера и темная тема */
        body {
            background-color: #161d29;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .launcher-card {
            background: #202b3c;
            padding: 40px;
            border-radius: 6px;
            width: 380px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border: 1px solid #2b394e;
        }
        h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin: 0 0 10px 0;
            text-transform: uppercase;
        }
        .subtitle {
            color: #8fa0b5;
            font-size: 14px;
            margin-bottom: 35px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        input {
            width: 100%;
            padding: 14px;
            background: #18202c;
            border: 1px solid #2d3b50;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #0091ff;
        }
        .btn-action {
            width: 100%;
            padding: 14px;
            background: #0091ff;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-action:hover {
            background: #007adb;
        }
        .toggle-mode {
            margin-top: 25px;
            font-size: 13px;
            color: #8fa0b5;
        }
        #switch-mode-btn {
            color: #0091ff;
            cursor: pointer;
            font-weight: 600;
        }
        #switch-mode-btn:hover {
            text-decoration: underline;
        }
        .footer-notice {
            margin-top: 30px;
            font-size: 11px;
            color: #55667d;
        }
        /* Фиолетовая админка Создателя */
        .admin-panel {
            margin-top: 30px;
            background: #2a1b2d;
            border: 1px solid #4a2d52;
            padding: 20px;
            border-radius: 6px;
            width: 380px;
            box-sizing: border-box;
            display: none; 
        }
        .admin-panel h3 { margin-top: 0; color: #ff5555; text-align: center; }
        .admin-buttons { display: flex; justify-content: space-between; margin-top: 10px; }
        .admin-btn { padding: 10px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; flex: 1; margin: 0 5px; }
        .btn-ban { background: #d9534f; }
        .btn-unban { background: #5cb85c; }
        .btn-delete { background: #f0ad4e; }
    </style>
</head>
<body>

    <!-- КАРТОЧКА ОКНА ЛАУНЧЕРА -->
    <div class="launcher-card">
        <h1 id="form-title">PARKOUR Studio</h1>
        <div class="subtitle" id="form-subtitle">Start creating your own games!</div>
        
        <div class="input-group">
            <input type="email" id="user-email" placeholder="Username (Email)">
        </div>
        <div class="input-group">
            <input type="password" id="user-password" placeholder="Password">
        </div>
        
        <button class="btn-action" id="submit-btn">Log In</button>
        
        <div class="toggle-mode" id="mode-text">
            Don't have an account? <span id="switch-mode-btn">Sign up</span>
        </div>
        
        <div class="footer-notice">Данные надежно сохраняются в базу данных Firebase.</div>
    </div>

    <!-- ТЕХНИЧЕСКАЯ АДМИН-ПАНЕЛЬ -->
    <div class="admin-panel" id="admin-section">
        <h3>Панель Создателя</h3>
        <div class="input-group">
            <input type="text" id="target-uid" placeholder="Введи UID игрока">
        </div>
        <div class="admin-buttons">
            <button class="admin-btn btn-ban" onclick="adminBanPlayer()">Бан</button>
            <button class="admin-btn btn-unban" onclick="adminUnbanPlayer()">Разбан</button>
            <button class="admin-btn btn-delete" onclick="adminDeletePlayer()">Удалить</button>
        </div>
    </div>
<script>
    // =======================================================
    // 1. НАСТРОЙКА FIREBASE (Замени тестовые данные на свои)
    // =======================================================
    const firebaseConfig = {
        apiKey: "ВСТАВЬ_СЮДА_СВОЙ_API_KEY",
        authDomain: "://firebaseapp.com",
        databaseURL: "https://firebaseio.com",
        projectId: "parkour-studio",
        storageBucket: "://appspot.com",
        messagingSenderId: "1234567890",
        appId: "1:123456:web:123456"
    };

    // Инициализация сервисов Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.database();

    // Состояние формы (false = Логин, true = Регистрация)
    let isSignUp = false;

    // Получаем элементы интерфейса
    const submitBtn = document.getElementById('submit-btn');
    const modeText = document.getElementById('mode-text');
    const emailInput = document.getElementById('user-email');
    const passwordInput = document.getElementById('user-password');
    const adminSection = document.getElementById('admin-section');

    // =======================================================
    // 2. БЕЗОПАСНОЕ ПЕРЕКЛЮЧЕНИЕ РЕЖИМА (SIGN UP / LOG IN)
    // =======================================================
    document.addEventListener('click', function(event) {
        if (event.target && event.target.id === 'switch-mode-btn') {
            isSignUp = !isSignUp;
            
            if (isSignUp) {
                submitBtn.innerText = "Sign Up";
                modeText.innerHTML = 'Already have an account? <span id="switch-mode-btn">Log in</span>';
            } else {
                submitBtn.innerText = "Log In";
                modeText.innerHTML = 'Don\'t have an account? <span id="switch-mode-btn">Sign up</span>';
            }
        }
    });

    // =======================================================
    // 3. ОТПРАВКА ФОРМЫ (РЕГИСТРАЦИЯ И ВХОД С ПРОВЕРКОЙ БАНА)
    // =======================================================
    submitBtn.addEventListener('click', () => {
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
            alert("Пожалуйста, заполните почту и пароль!");
            return;
        }

        if (isSignUp) {
            // РЕГИСТРАЦИЯ ИГРОКА
            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    
                    // Создаем базовую карточку игрока в Realtime Database
                    db.ref('users/' + user.uid).set({
                        email: user.email,
                        isBanned: false,
                        role: "player"
                    }).then(() => {
                        alert("Вы успешно зарегистрировались! Теперь войдите в аккаунт.");
                        location.reload(); 
                    });
                })
                .catch((error) => {
                    alert("Ошибка регистрации: " + error.message);
                });
        } else {
            // ВХОД В ИГРУ И ПРОВЕРКА НА БАН
            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    
                    // Читаем данные из базы данных
                    db.ref('users/' + user.uid).once('value').then((snapshot) => {
                        const userData = snapshot.val();
                        
                        if (snapshot.exists()) {
                            // Проверка статуса блокировки
                            if (userData.isBanned === true) {
                                alert("Вход заблокирован! Вы забанены администратором.");
                                auth.signOut();
                                return;
                            }
                            
                            // Проверка роли Администратора
                            if (userData.role === "admin") {
                                adminSection.style.display = "block";
                                alert("Приветствуем в Панели Создателя!");
                            } else {
                                adminSection.style.display = "none";
                                alert("Успешный вход! Игра запускается...");
                                if (typeof runParkourGame === "function") runParkourGame();
                            }
                        } else {
                            // Автоматическое создание карточки, если аккаунта нет в БД
                            db.ref('users/' + user.uid).set({
                                email: user.email,
                                isBanned: false,
                                role: "player"
                            });
                            alert("Профиль успешно создан. Добро пожаловать!");
                        }
                    });
                })
                .catch((error) => {
                    alert("Ошибка авторизации: " + error.message);
                });
        }
    });

    // =======================================================
    // 4. ФУНКЦИИ УПРАВЛЕНИЯ ИГРОКАМИ ДЛЯ АДМИН-ПАНЕЛИ
    // =======================================================
    function getTargetUid() {
        const uid = document.getElementById('target-uid').value.trim();
        if(!uid) alert("Сначала введите UID игрока!");
        return uid;
    }

    // Забанить игрока
    function adminBanPlayer() {
        const uid = getTargetUid();
        if(!uid) return;
        db.ref('users/' + uid).update({ isBanned: true })
            .then(() => alert(`Игрок ${uid} ЗАБАНЕН!`))
            .catch(err => alert("Ошибка: " + err.message));
    }

    // Разбанить игрока
    function adminUnbanPlayer() {
        const uid = getTargetUid();
        if(!uid) return;
        db.ref('users/' + uid).update({ isBanned: false })
            .then(() => alert(`Игрок ${uid} РАЗБАНЕН!`))
            .catch(err => alert("Ошибка: " + err.message));
    }

    // Удалить профиль из БД
    function adminDeletePlayer() {
        const uid = getTargetUid();
        if(!uid) return;
        if(confirm("Удалить профиль игрока из базы навсегда?")) {
            db.ref('users/' + uid).remove()
                .then(() => alert(`Данные игрока ${uid} удалены.`))
                .catch(err => alert("Ошибка: " + err.message));
        }
    }

    // Запуск игры
    function runParkourGame() {
        console.log("Игра запускается...");
    }
</script>
</body>
</html>
